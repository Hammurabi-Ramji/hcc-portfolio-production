[build]
target = "site/index-site.html"
dist = "site-dist"
offline = true
filehash = false
inject_scripts = false

[serve]
addresses = ["127.0.0.1"]
port = 8081
open = false
no_autoreload = true

[watch]
watch = ["ui", "site", "index.html", "crates/wasm-frontend", "tools/frontend-build"]
ignore = ["target", "dist", "site-dist", "public"]

[[hooks]]
stage = "pre_build"
command = "cargo"
command_arguments = ["run", "--offline", "--package", "frontend-build"]

[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["run", "--offline", "--package", "frontend-build", "--", "site-cache"]
