[package]
name = "straw-web-api"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
axum = "=0.7.9"
rusqlite = { version = "=0.31.0", features = ["bundled"] }
argon2 = "=0.5.3"
rand = "=0.8.6"
sha2 = "=0.10.9"
chrono = { version = "=0.4.44", default-features = false, features = ["clock", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.45.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
url = "=2.5.4"

[dev-dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }
tempfile = "=3.20.0"
