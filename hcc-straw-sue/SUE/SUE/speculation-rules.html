<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HCC — Speculation Rules</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #f3f4f6;
      padding: 20px;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .status {
      text-align: center;
      padding: 40px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
    }
    h1 { font-size: 18px; margin-bottom: 12px; }
    .prerender-info {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(99,102,241,0.2);
      color: #a78bfa;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 12px;
    }
    .note { font-size: 13px; color: #9ca3af; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="status">
    <h1>SUE — Pre-rendering Ready</h1>
    <div class="prerender-info">⚡ Speculation Rules Active</div>
    <p class="note">
      Views are pre-rendered in the background for instant navigation.<br/>
      This document stays alive in memory for seamless transitions.
    </p>
  </div>

  <!-- Speculation Rules for Prerendering -->
  <script type="speculationrules">
  {
    "prerender": [
      {
        "source": "list",
        "urls": [
          "/sue.html?view=kanban",
          "/sue.html?view=ai-chat",
          "/sue.html?view=notes",
          "/sue.html?view=cloud",
          "/sue.html?view=settings"
        ],
        "where": {
          "href_matches": ["*"]
        }
      }
    ],
    "prefetch": [
      {
        "source": "list",
        "urls": [
          "/styles.css",
          "/sue-view.wasm",
          "/icons/*"
        ],
        "where": {
          "href_matches": ["*"]
        }
      }
    ]
  }
  </script>

  <script>
    // Keepalive for pre-rendered page
    setInterval(() => {
      // Just keep the page alive
      console.log('[HCC PreRender] Pre-render kept alive');
    }, 30000);

    // Listen for visibility change
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        console.log('[HCC PreRender] Page became visible - instant navigation!');
      }
    });
  </script>
</body>
</html>
