[package]
name = "straw-stack"
version = "0.1.0"
description = "STRAW sovereign desktop"
authors = ["Hammurabi Coding Company"]
edition = "2021"
default-run = "straw-stack"

[lib]
name = "straw_stack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = [] }
serde.workspace = true
serde_json.workspace = true
straw-engine = { path = "../crates/engine" }
axum-loop = { path = "../crates/axum-loop" }
wasm-frontend = { path = "../crates/wasm-frontend" }
tokio.workspace = true
straw-storage = { path = "../crates/storage" }
straw-fabricator = { path = "../crates/fabricator" }
straw-security = { path = "../crates/security" }
straw-stele = { path = "../crates/stele" }
straw-accordion = { path = "../crates/accordion" }
crucible = { path = "../crates/crucible" }
zeroize = "=1.9.1"
tauri-plugin-dialog = "=2.7.3"
straw-inference = { path = "../crates/inference" }
specta.workspace = true
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript", "javascript"] }

[dev-dependencies]
sqlx.workspace = true
tempfile = "=3.27.0"
tauri = { version = "=2.12.2", features = ["test"] }
