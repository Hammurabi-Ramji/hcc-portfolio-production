<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HCC — Offscreen</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #f3f4f6;
      padding: 20px;
      line-height: 1.6;
    }
    h1 { font-size: 18px; margin-bottom: 12px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(34,197,94,0.15);
      color: #4ade80;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .note { font-size: 13px; color: #9ca3af; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>HCC Offscreen Document</h1>
  <div class="status">
    <span class="status-dot"></span>
    Active
  </div>
  <p class="note">
    This offscreen document handles:<br/>
    • Clipboard API access<br/>
    • Audio processing (Web Audio API)<br/>
    • Heavy computation with browser APIs<br/>
    • Web Workers with DOM dependencies
  </p>

  <!-- External script — required by MV3 CSP (no inline scripts allowed) -->
  <script src="offscreen-worker.js"></script>
</body>
</html>
