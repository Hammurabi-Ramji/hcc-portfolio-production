[package]
name = "sue-core"
version = "5.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Storage",
    "Document",
    "Element",
    "Location",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
leptos = "0.7"
leptos_router = "0.7"
serde = "1.0"
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4", "js"] }
url = "2.5"
hex = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
