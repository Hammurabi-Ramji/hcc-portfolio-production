[package]
name        = "sue-view"
version     = "5.0.0"
edition     = "2021"
description = "SUE Sovereign Sidebar — Leptos WASM frontend"
license     = "MIT"
repository  = "https://github.com/hammurabicoding/sue"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen             = "0.2"
wasm-bindgen-futures     = "0.4"
console_error_panic_hook = "0.1"
js-sys                   = "0.3"
serde-wasm-bindgen       = "0.6"

leptos        = { version = "0.7", features = ["csr"] }
leptos_router = { version = "0.7" }

serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing    = "0.1"
chrono     = { version = "0.4", features = ["serde"] }

[dependencies.web-sys]
version  = "0.3"
features = [
  "Window",
  "Storage",
  "Document",
  "HtmlElement",
  "console",
  "Location",
]


[package.metadata.wasm-pack.profile.release]
wasm-opt = false
