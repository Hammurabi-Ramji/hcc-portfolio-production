[workspace]
resolver = "2"
members = ["src-tauri", "crates/engine", "crates/wasm-frontend", "crates/axum-loop", "crates/straw-ledger", "tools/frontend-build"]
default-members = ["crates/engine", "crates/axum-loop", "crates/wasm-frontend"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "thin"

