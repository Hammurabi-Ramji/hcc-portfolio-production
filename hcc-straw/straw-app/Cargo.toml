[workspace]
resolver = "2"
members = ["src-tauri", "crates/engine", "crates/wasm-frontend", "crates/axum-loop", "crates/straw-ledger", "crates/eduba-ledger", "crates/eduba-server", "crates/storage", "crates/inference", "crates/fabricator", "crates/security", "crates/crucible", "crates/accordion", "crates/stele", "tools/frontend-build"]
default-members = ["crates/engine", "crates/axum-loop", "crates/wasm-frontend"]

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.27.0", features = ["v4", "serde"] }
axum = "=0.8.9"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "sync"] }
thiserror = "=2.0.21"
chrono = { version = "=0.4.45", features = ["serde"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "uuid", "serde_json"] }
sha2 = "=0.10.9"

[profile.release]
lto = "thin"

