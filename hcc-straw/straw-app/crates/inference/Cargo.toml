[package]
name = "straw-inference"
version = "0.1.0"
edition = "2021"

[features]
default = []
worker = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[[bin]]
name = "straw-infer"
path = "src/main.rs"
required-features = ["worker"]

[[test]]
name = "protocol"
path = "tests/protocol.rs"
required-features = ["worker"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
sha2.workspace = true
straw-engine = { path = "../engine" }
candle-core = { version = "=0.11.0", optional = true }
candle-nn = { version = "=0.11.0", optional = true }
candle-transformers = { version = "=0.11.0", optional = true }
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"], optional = true }

[dev-dependencies]
tempfile = "=3.27.0"
