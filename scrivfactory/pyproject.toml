[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrivfactory"
version = "0.2.0b1"
description = "CLI-first Scrivener 3 Template Factory for generating Scrivener 3 projects from JSON/YAML definitions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Hammurabi Coding Company" }
]
keywords = ["scrivener", "template", "cli", "rtf", "xml", "fda", "compliance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Text Processing :: Markup :: XML",
  "Topic :: Utilities"
]
dependencies = [
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0"
]

[project.scripts]
scrivfactory = "scrivfactory.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"scrivfactory.templates" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]
addopts = "-q"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
