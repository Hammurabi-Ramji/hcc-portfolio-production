[workspace]
resolver = "2"
members = ["app", "crates/engine", "crates/storage", "crates/axum-loop", "crates/security"]
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
axum = "=0.8.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "uuid", "serde_json"] }
sha2 = "0.10"
