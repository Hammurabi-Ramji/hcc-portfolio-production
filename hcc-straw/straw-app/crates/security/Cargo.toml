[package]
name = "straw-security"
version = "0.1.0"
edition = "2021"
[dependencies]
straw-storage = { path = "../storage" }
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
sqlx.workspace = true
sha2.workspace = true
uuid.workspace = true
argon2 = "=0.5.3"
chacha20poly1305 = "=0.10.1"
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
zeroize = "=1.9.1"
getrandom = "=0.3.4"
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
aes = { version = "=0.8.4", features = ["zeroize"] }
hkdf = "=0.12.4"
tokio.workspace = true
[dev-dependencies]
tempfile = "=3.27.0"
